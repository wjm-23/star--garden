# ==================== 测试环境配置 ====================
# 使用 H2 内存库，不依赖本地 MySQL；关闭模拟数据播种，保证测试快速且可重复
spring.datasource.url=jdbc:h2:mem:sg_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# 不执行 data.sql（语法为 MySQL 方言），图鉴/管理员由 DataSeeder 兜底
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# 关闭 60 个模拟用户的行为数据播种（单元测试与集成测试不需要）
app.data.seed=false

app.jwt.secret=TestJWTSecretKey-for-unit-tests-0123456789abcdef
app.jwt.expire-minutes=60
