# ==================== H2 内存数据库（免安装快速演示，每次启动全新库） ====================
# 启动方式：--spring.profiles.active=h2
spring.datasource.url=jdbc:h2:mem:star_garden;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# data.sql 在 Hibernate 建表之后执行（确保 INSERT 成功）
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==================== OpenAPI 接口文档（/swagger-ui.html） ====================
# 只收录业务 REST 接口，SPA 页面回退路由不进文档
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
