<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>用户管理 - 星芽花园</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a2a3a 0%, #0d1b2a 100%); min-height: 100vh; }
    .container { padding-top: 30px; }
    .page-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); border-radius: 30px; padding: 30px; }
    .page-title { color: #FFD700; margin-bottom: 25px; }
    .nav-buttons { margin-bottom: 20px; }
    .nav-buttons .btn { margin-right: 10px; }
    table { color: white; }
    footer { text-align: center; margin-top: 30px; color: rgba(255,255,255,0.5); }
    .home-btn { position: fixed; bottom: 25px; right: 25px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 50px; padding: 12px 24px; color: white; text-decoration: none; }
    .home-btn:hover { background: rgba(255,215,0,0.8); color: #1a2a3a; }
  </style>
</head>
<body>
<div class="container">
  <div class="page-card">
    <h2 class="page-title">👑 用户管理</h2>

    <div class="nav-buttons">
      <a href="/admin/users" class="btn btn-primary">👥 用户管理</a>
      <a href="/admin/plants" class="btn btn-secondary">🌱 植物管理</a>
      <a href="/index" class="btn btn-secondary">🏠 返回首页</a>
    </div>

    <table class="table table-dark table-striped">
      <thead>
      <tr><th>ID</th><th>用户名</th><th>邮箱</th><th>昵称</th><th>角色</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody>
      <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.nickname != null ? user.nickname : '-'}"></td>
        <td>
          <span th:if="${user.role == 'ADMIN'}" class="badge bg-danger">管理员</span>
          <span th:if="${user.role != 'ADMIN'}" class="badge bg-secondary">普通用户</span>
        </td>
        <td>
          <span th:if="${user.enabled}" class="badge bg-success">正常</span>
          <span th:unless="${user.enabled}" class="badge bg-dark">禁用</span>
        </td>
        <td>
          <a th:href="'/admin/user/toggle?id=' + ${user.id}" class="btn btn-sm btn-warning" th:text="${user.enabled} ? '禁用' : '启用'"></a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <footer>© 2023 202339170206 魏佳冕 - 星芽花园</footer>
</div>
<a href="/index" class="home-btn">🏠 返回花园</a>
</body>
</html>
