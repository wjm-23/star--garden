<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>植物表单 - 星芽花园</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3 th:text="${plant.id != null} ? '编辑植物' : '添加植物'">植物表单</h3>
        </div>
        <div class="card-body">
            <form action="/admin/plant/save" method="post">
                <input type="hidden" name="id" th:value="${plant.id}">
                <div class="mb-3">
                    <label>名称</label>
                    <input type="text" name="name" class="form-control" th:value="${plant.name}" required>
                </div>
                <div class="mb-3">
                    <label>描述</label>
                    <input type="text" name="description" class="form-control" th:value="${plant.description}">
                </div>
                <div class="mb-3">
                    <label>稀有度</label>
                    <select name="rarity" class="form-control">
                        <option value="COMMON" th:selected="${plant.rarity == 'COMMON'}">普通</option>
                        <option value="RARE" th:selected="${plant.rarity == 'RARE'}">稀有</option>
                        <option value="LEGENDARY" th:selected="${plant.rarity == 'LEGENDARY'}">传说</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="/admin/plants" class="btn btn-secondary">返回</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
