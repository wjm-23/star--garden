<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>植物管理 - 星芽花园</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a2a3a 0%, #0d1b2a 100%); min-height: 100vh; }
        .container { padding-top: 30px; }
        .page-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); border-radius: 30px; padding: 30px; }
        .page-title { color: #FFD700; margin-bottom: 25px; }
        .nav-buttons { margin-bottom: 20px; }
        .nav-buttons .btn { margin-right: 10px; }
        .btn-add { margin-bottom: 20px; }
        table { color: white; }
        footer { text-align: center; margin-top: 30px; color: rgba(255,255,255,0.5); }
        .home-btn { position: fixed; bottom: 25px; right: 25px; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); border-radius: 50px; padding: 12px 24px; color: white; text-decoration: none; }
        .home-btn:hover { background: rgba(255,215,0,0.8); color: #1a2a3a; }
        .emoji-icon { font-size: 1.2rem; margin-right: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="page-card">
        <h2 class="page-title">🌱 植物管理</h2>

        <div class="nav-buttons">
            <a href="/admin/users" class="btn btn-secondary">👥 用户管理</a>
            <a href="/admin/plants" class="btn btn-primary">🌱 植物管理</a>
            <a href="/index" class="btn btn-secondary">🏠 返回首页</a>
        </div>

        <a href="/admin/plant/add" class="btn btn-success btn-add">+ 添加植物</a>

        <table class="table table-dark table-striped">
            <thead>
            <tr><th>ID</th><th>名称</th><th>图标</th><th>描述</th><th>稀有度</th><th>操作</th></tr>
            </thead>
            <tbody>
            <tr th:each="plant : ${plants}">
                <td th:text="${plant.id}"></td>
                <td>
                    <span th:if="${plant.name == '智慧藤'}">📚🌿</span>
                    <span th:if="${plant.name == '专注花'}">🎯🌸</span>
                    <span th:if="${plant.name == '活力草'}">💪🍃</span>
                    <span th:if="${plant.name == '晨光花'}">🌅🌻</span>
                    <span th:if="${plant.name == '宁静叶'}">🧘🍀</span>
                    <span th:if="${plant.name == '星芽草'}">✨🌱</span>
                    <span th:text="${plant.name}">植物名</span>
                </td>
                <td th:text="${plant.name}">植物名</td>
                <td th:text="${plant.description}">描述</td>
                <td>
                    <span th:if="${plant.rarity == 'COMMON'}" class="badge bg-success">普通</span>
                    <span th:if="${plant.rarity == 'RARE'}" class="badge bg-warning">稀有</span>
                    <span th:if="${plant.rarity == 'LEGENDARY'}" class="badge bg-danger">传说</span>
                </td>
                <td>
                    <a th:href="'/admin/plant/edit?id=' + ${plant.id}" class="btn btn-sm btn-warning">编辑</a>
                    <a th:href="'/admin/plant/delete?id=' + ${plant.id}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除这个植物吗？')">删除</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <footer>© 2023 202339170206 魏佳冕 - 星芽花园</footer>
</div>
<a href="/index" class="home-btn">🏠 返回花园</a>
</body>
</html>
