<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>年度专注报告 - 星芽花园</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="/lib/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at top, #10233b 0%, #05080f 60%), #05080f;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Poppins', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }
        .stars { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
        .star { position:absolute; background:white; border-radius:50%; opacity:.5; animation:tw 3s infinite; }
        @keyframes tw { 0%,100%{opacity:.15} 50%{opacity:.9} }
        .container { position: relative; z-index: 1; padding-top: 40px; padding-bottom: 50px; }
        .big-title {
            text-align: center; color: #FFD700; font-size: 2.4rem; font-weight: 700;
            background: linear-gradient(135deg, #FFD700, #FFA500, #ff6b9d);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 6px; letter-spacing: 2px;
        }
        .big-sub { text-align: center; color: rgba(255,255,255,0.55); margin-bottom: 35px; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: rgba(255,255,255,0.07); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,215,0,0.25); border-radius: 24px;
            padding: 24px 18px; text-align: center;
        }
        .stat-num { font-size: 2.4rem; font-weight: 700; color: #FFD700; line-height: 1.1; }
        .stat-num small { font-size: 1rem; color: rgba(255,215,0,0.75); }
        .stat-label { color: rgba(255,255,255,0.7); margin-top: 8px; font-size: 0.9rem; }
        .panel {
            background: rgba(255,255,255,0.07); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
            padding: 22px; margin-bottom: 25px;
        }
        .panel h5 { color: white; margin-bottom: 15px; }
        .chart-box { width: 100%; height: 320px; }
        .home-btn {
            position: fixed; bottom: 25px; right: 25px;
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            border-radius: 50px; padding: 12px 24px; color: white;
            text-decoration: none; z-index: 100;
        }
        .home-btn:hover { background: rgba(255,215,0,0.8); color: #1a2a3a; }
        .best-day-tip {
            text-align: center; color: rgba(255,255,255,0.85); background: rgba(255,215,0,0.1);
            border: 1px dashed rgba(255,215,0,0.4); border-radius: 20px; padding: 14px; margin-bottom: 25px;
        }
        footer { text-align: center; color: rgba(255,255,255,0.4); font-size: 0.8rem; margin-top: 20px; }
    </style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
    <h1 class="big-title" id="title">年度专注报告</h1>
    <p class="big-sub">✨ 你的每一段专注时光，都被这座花园记得 ✨</p>

    <div class="best-day-tip" id="bestDayTip">数据加载中...</div>

    <div class="stat-grid" id="statGrid">
        <div class="stat-card"><div class="stat-num" id="sHours">--</div><div class="stat-label">年度专注总时长（小时）</div></div>
        <div class="stat-card"><div class="stat-num" id="sCount">--</div><div class="stat-label">完成任务次数</div></div>
        <div class="stat-card"><div class="stat-num" id="sDays">--</div><div class="stat-label">活跃天数</div></div>
        <div class="stat-card"><div class="stat-num" id="sFav">--</div><div class="stat-label">最爱专注类别</div></div>
    </div>

    <div class="row">
        <div class="col-lg-7">
            <div class="panel"><h5>月度专注时长趋势</h5><div id="monthChart" class="chart-box"></div></div>
        </div>
        <div class="col-lg-5">
            <div class="panel"><h5>类别时间分配</h5><div id="catChart" class="chart-box"></div></div>
        </div>
    </div>

    <footer>©  202339170206 魏佳冕 - 星芽花园 | 年度专注报告大屏</footer>
</div>
<a href="/index" class="home-btn">🏠 返回花园</a>

<script>
    // 星星背景
    (function() {
        const box = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            const size = Math.random() * 2.5 + 1;
            s.style.width = size + 'px'; s.style.height = size + 'px';
            s.style.animationDelay = Math.random() * 4 + 's';
            box.appendChild(s);
        }
    })();

    const GOLD = '#FFD700';
    const textStyle = { color: 'rgba(255,255,255,0.85)' };

    fetch('/api/report/annual').then(r => r.json()).then(res => {
        if (!res.success) return;
        document.getElementById('title').textContent = res.year + ' 年度专注报告';
        document.getElementById('sHours').innerHTML = res.totalHours + '<small> h</small>';
        document.getElementById('sCount').textContent = res.totalCount;
        document.getElementById('sDays').textContent = res.activeDays;
        document.getElementById('sFav').textContent = res.favoriteCategory;
        document.getElementById('bestDayTip').textContent = res.bestDay
            ? '🏆 你最投入的一天是 ' + res.bestDay.date + '，专注了 ' + res.bestDay.minutes + ' 分钟'
            : '今年还没有专注记录，从现在开始浇灌你的花园吧';

        // 月度柱状图
        const mc = echarts.init(document.getElementById('monthChart'));
        mc.setOption({
            backgroundColor: 'transparent',
            tooltip: { trigger: 'axis' },
            grid: { left: 55, right: 20, top: 30, bottom: 30 },
            xAxis: { type: 'category', data: res.months.map(m => m.month + '月'), axisLabel: textStyle },
            yAxis: { type: 'value', name: '分钟', axisLabel: textStyle, nameTextStyle: textStyle },
            series: [{
                type: 'bar', data: res.months.map(m => m.minutes),
                itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                    colorStops: [{ offset: 0, color: '#FFD700' }, { offset: 1, color: 'rgba(255,165,0,0.25)' }] },
                    borderRadius: [8, 8, 0, 0] }
            }]
        });

        // 类别饼图
        const cc = echarts.init(document.getElementById('catChart'));
        const colors = ['#FFD700','#FFA500','#2ecc71','#3498db','#9b59b6','#e74c3c','#1abc9c'];
        cc.setOption({
            backgroundColor: 'transparent',
            tooltip: { trigger: 'item', formatter: '{b}: {c} 分钟 ({d}%)' },
            legend: { bottom: 0, textStyle: textStyle },
            series: [{
                type: 'pie', radius: ['40%', '68%'], roseType: 'radius',
                data: res.categories.map((c, i) => ({
                    name: c.category, value: c.minutes,
                    itemStyle: { color: colors[i % colors.length] }
                })),
                label: { color: 'rgba(255,255,255,0.85)', formatter: '{b} {d}%' }
            }]
        });
        window.addEventListener('resize', () => { mc.resize(); cc.resize(); });
    });
</script>
</body>
</html>
