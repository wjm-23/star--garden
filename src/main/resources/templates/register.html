<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册新账号 · 星芽花园</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/stargarden.css}">
  <style>
    .auth-wrap {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 960px;
      border-radius: 36px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        0 0 0 1px rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .auth-brand {
      background:
        radial-gradient(circle at 70% 30%, rgba(255,215,0,0.25), transparent 50%),
        radial-gradient(circle at 20% 70%, rgba(236,72,153,0.22), transparent 55%),
        linear-gradient(160deg, rgba(15,61,46,0.65) 0%, rgba(26,109,79,0.45) 100%);
      padding: 56px 48px;
      position: relative;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .auth-brand::after {
      content: '';
      position: absolute;
      left: 0; top: 10%;
      width: 1px; height: 80%;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18), transparent);
    }
    .auth-logo {
      font-size: 3.6rem;
      margin-bottom: 16px;
      animation: float 4s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(2deg); }
      50%      { transform: translateY(-12px) rotate(-2deg); }
    }
    .auth-brand h2 {
      font-weight: 800;
      font-size: 2.2rem;
      line-height: 1.2;
      background: linear-gradient(135deg, #FFD700 0%, #4ade80 60%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .auth-brand p { color: rgba(255,255,255,0.8); line-height: 1.8; font-size: 0.95rem; }

    .auth-form {
      padding: 46px 44px;
      background: rgba(255,255,255,0.97);
      position: relative;
    }
    .auth-form h3 {
      color: #166534;
      font-weight: 800;
      margin-bottom: 6px;
      font-size: 1.6rem;
    }
    .auth-form .sub { color: #86a89a; margin-bottom: 24px; font-size: 0.9rem; }
    .auth-field { margin-bottom: 14px; }
    .auth-field label {
      display: block;
      font-size: 0.82rem;
      color: #166534;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .auth-field input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #d1fae5;
      background: #f0fdf4;
      color: #064e3b;
      transition: all 0.3s;
      outline: none;
      font-size: 0.92rem;
    }
    .auth-field input:focus {
      border-color: #22c55e;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(34,197,94,0.12);
    }
    .auth-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 50%, #FFD700 100%);
      box-shadow: 0 10px 24px rgba(34,197,94,0.35);
      letter-spacing: 2px;
      transition: all 0.3s;
    }
    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(34,197,94,0.5);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 20px 0 14px;
      color: #b5c9be;
      font-size: 0.8rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    .auth-divider span { padding: 0 16px; }

    .auth-switch-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      text-decoration: none;
      display: block;
      text-align: center;
      font-weight: 600;
      color: #166534;
      background: #ecfdf5;
      border: 1.5px dashed #86efac;
      transition: all 0.3s;
    }
    .auth-switch-btn:hover { background: #dcfce7; transform: translateY(-1px); color: #166534; }

    .auth-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 500;
    }
    .auth-footer {
      position: absolute;
      bottom: 16px; left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 0.78rem;
      letter-spacing: 1px;
      z-index: 6;
    }
    @media (max-width: 820px) {
      .auth-card { grid-template-columns: 1fr; max-width: 560px; }
      .auth-brand { padding: 32px 28px; }
      .auth-brand h2 { font-size: 1.6rem; }
      .auth-brand .auth-logo { font-size: 2.4rem; }
      .auth-form { padding: 36px 28px; }
    }
  </style>
</head>
<body class="auth-body">
  <div class="auth-stars" id="authStars"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <!-- 左：表单 -->
      <div class="auth-form">
        <h3>📝 创建账号</h3>
        <div class="sub">一起种下第一颗专注的种子吧 🌱</div>

        <div class="auth-error" th:if="${error}" th:text="${error}"></div>

        <form action="/register" method="post">
          <div class="row" style="margin:0 -6px;">
            <div class="col-md-6" style="padding:0 6px;">
              <div class="auth-field">
                <label>用户名</label>
                <input type="text" name="username" placeholder="输入用户名" required>
              </div>
            </div>
            <div class="col-md-6" style="padding:0 6px;">
              <div class="auth-field">
                <label>邮箱</label>
                <input type="email" name="email" placeholder="your@email.com" required>
              </div>
            </div>
            <div class="col-md-6" style="padding:0 6px;">
              <div class="auth-field">
                <label>密码</label>
                <input type="password" name="password" placeholder="设置密码" required>
              </div>
            </div>
            <div class="col-md-6" style="padding:0 6px;">
              <div class="auth-field">
                <label>确认密码</label>
                <input type="password" name="confirmPassword" placeholder="再次输入密码" required>
              </div>
            </div>
            <div class="col-12" style="padding:0 6px;">
              <div class="auth-field">
                <label>昵称</label>
                <input type="text" name="nickname" placeholder="给自己起个好听的名字（可留空）">
              </div>
            </div>
          </div>
          <button type="submit" class="auth-btn">🌿 注 册 新 账 号</button>
          <div class="auth-divider"><span>已经有账号了？</span></div>
          <a href="/login" class="auth-switch-btn">↩ 返回登录页面</a>
        </form>
      </div>
      <!-- 右：品牌区 -->
      <div class="auth-brand" style="align-items:flex-end; text-align:right;">
        <span class="auth-logo">✨🌸🌿</span>
        <h2>开启你的<br>专属花园之旅</h2>
        <p>注册即可获得：<br>
        🎁 3种基础植物种子<br>
        🏆 首次完成任务解锁成就<br>
        👥 好友森林等你来逛</p>
      </div>
    </div>
  </div>

  <div class="auth-footer">© 202339170206 魏佳冕 · 星芽花园 | 专注让生活开花</div>

  <script th:src="@{/js/stargarden.js}"></script>
  <script>
    createStarBackground('authStars', { count: 180, starClass: 'auth-star', shooting: true });
  </script>
</body>
</html>
