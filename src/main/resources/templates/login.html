<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录星芽花园 · 每一份专注都会让花园开花</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/stargarden.css}">
  <style>
    .auth-wrap {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 960px;
      border-radius: 36px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        0 0 0 1px rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .auth-brand {
      background:
        radial-gradient(circle at 30% 20%, rgba(255,215,0,0.25), transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(139,92,246,0.25), transparent 50%),
        linear-gradient(160deg, rgba(15,61,46,0.6) 0%, rgba(26,109,79,0.4) 100%);
      padding: 56px 48px;
      position: relative;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .auth-brand::after {
      content: '';
      position: absolute;
      right: 0; top: 10%;
      width: 1px; height: 80%;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18), transparent);
    }
    .auth-logo {
      font-size: 3.6rem;
      margin-bottom: 16px;
      animation: float 4s ease-in-out infinite;
      display: inline-block;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50%      { transform: translateY(-12px) rotate(2deg); }
    }
    .auth-brand h2 {
      font-weight: 800;
      font-size: 2.4rem;
      line-height: 1.2;
      background: linear-gradient(135deg, #FFD700 0%, #4ade80 60%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .auth-brand p {
      color: rgba(255,255,255,0.8);
      font-size: 0.98rem;
      line-height: 1.8;
    }
    .auth-features {
      margin-top: 32px;
      list-style: none;
      padding: 0;
    }
    .auth-features li {
      padding: 10px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.85);
      font-size: 0.9rem;
    }
    .auth-features .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: linear-gradient(135deg, #FFD700, #4ade80);
      box-shadow: 0 0 10px rgba(255,215,0,0.6);
    }

    .auth-form {
      padding: 56px 48px;
      background: rgba(255,255,255,0.97);
      position: relative;
    }
    .auth-form h3 {
      color: #166534;
      font-weight: 800;
      margin-bottom: 6px;
      font-size: 1.7rem;
    }
    .auth-form .sub {
      color: #86a89a;
      margin-bottom: 28px;
      font-size: 0.9rem;
    }
    .auth-field {
      margin-bottom: 18px;
    }
    .auth-field label {
      display: block;
      font-size: 0.82rem;
      color: #166534;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .auth-field input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1.5px solid #d1fae5;
      background: #f0fdf4;
      color: #064e3b;
      transition: all 0.3s;
      outline: none;
      font-size: 0.95rem;
    }
    .auth-field input:focus {
      border-color: #22c55e;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(34,197,94,0.12);
    }
    .auth-btn {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #16a34a 0%, #22c55e 50%, #FFD700 100%);
      box-shadow: 0 10px 24px rgba(34,197,94,0.35);
      letter-spacing: 2px;
      transition: all 0.3s;
    }
    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(34,197,94,0.5);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 24px 0 16px;
      color: #b5c9be;
      font-size: 0.8rem;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    .auth-divider span { padding: 0 16px; }

    .auth-switch-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      text-decoration: none;
      display: block;
      text-align: center;
      font-weight: 600;
      color: #166534;
      background: #ecfdf5;
      border: 1.5px dashed #86efac;
      transition: all 0.3s;
    }
    .auth-switch-btn:hover {
      background: #dcfce7;
      transform: translateY(-1px);
      color: #166534;
    }
    .auth-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 500;
    }
    .auth-footer {
      position: absolute;
      bottom: 16px; left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.55);
      font-size: 0.78rem;
      letter-spacing: 1px;
      z-index: 6;
    }
    @media (max-width: 820px) {
      .auth-card { grid-template-columns: 1fr; max-width: 560px; }
      .auth-brand { padding: 36px 28px; }
      .auth-brand h2 { font-size: 1.8rem; }
      .auth-brand .auth-logo { font-size: 2.6rem; }
      .auth-form { padding: 40px 28px; }
    }
  </style>
</head>
<body class="auth-body">
  <div class="auth-stars" id="authStars"></div>

  <div class="auth-wrap">
    <div class="auth-card">
      <!-- 左：品牌展示 -->
      <div class="auth-brand">
        <span class="auth-logo">🌱✨</span>
        <h2>星芽花园</h2>
        <p>用专注浇灌你的秘密花园<br>每完成一个任务，就种下一颗植物种子</p>
      </div>
      <!-- 右：表单 -->
      <div class="auth-form">
        <h3>🌿 欢迎回来</h3>
        <div class="sub">登录你的星芽花园账号</div>

        <div class="auth-error" th:if="${error}" th:text="${error}"></div>

        <form action="/login" method="post">
          <div class="auth-field">
            <label>用户名</label>
            <input type="text" name="username" placeholder="请输入用户名" required autocomplete="username">
          </div>
          <div class="auth-field">
            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
          </div>
          <button type="submit" class="auth-btn">登 录</button>

          <div class="auth-divider"><span>或</span></div>

          <a href="/register" class="auth-switch-btn">🌱 还没有账号？立即注册新账号</a>
        </form>
      </div>
    </div>
  </div>

  <div class="auth-footer">© 202339170206 魏佳冕 · 星芽花园 | 专注让生活开花</div>

  <script th:src="@{/js/stargarden.js}"></script>
  <script>
    createStarBackground('authStars', { count: 180, starClass: 'auth-star', shooting: true });
  </script>
</body>
</html>
