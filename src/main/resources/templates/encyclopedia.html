<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物图鉴 · 星芽花园</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/stargarden.css}">
  <style>
    .enc-filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }
    .enc-filter {
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.75);
      font-size: 0.85rem;
      transition: all .25s;
      user-select: none;
    }
    .enc-filter:hover { border-color: rgba(74,222,128,0.5); color: #4ade80; }
    .enc-filter.active {
      background: linear-gradient(135deg, #FFD700, #4ade80);
      color: #0f172a; border-color: transparent; font-weight: 700;
    }

    .enc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 22px;
    }
    .enc-card {
      border-radius: 26px;
      padding: 26px 18px;
      text-align: center;
      background: linear-gradient(160deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(18px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }
    .enc-card[data-rarity="稀有"] { border-color: rgba(99,102,241,0.55); box-shadow: 0 10px 30px rgba(99,102,241,0.25); }
    .enc-card[data-rarity="史诗"] { border-color: rgba(255,215,0,0.6); box-shadow: 0 12px 36px rgba(255,215,0,0.32); }
    .enc-card[data-rarity="普通"] { border-color: rgba(74,222,128,0.28); }
    .enc-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 120px;
      background: radial-gradient(circle at top, rgba(255,215,0,0.15), transparent 70%);
      pointer-events: none;
    }
    .enc-card:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: rgba(74,222,128,0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .enc-card.locked { opacity: 0.55; filter: grayscale(0.8); }
    .enc-card.locked:hover { filter: grayscale(0.5); }
    .enc-emoji {
      font-size: 4.2rem;
      line-height: 1;
      display: block;
      margin-bottom: 14px;
      animation: bob 5s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
      position: relative;
      z-index: 2;
    }
    @keyframes bob {
      0%,100% { transform: translateY(0) rotate(-3deg); }
      50%     { transform: translateY(-8px) rotate(3deg); }
    }
    .enc-name {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 8px;
      position: relative;
      z-index: 2;
    }
    .enc-desc {
      color: rgba(255,255,255,0.5);
      font-size: 0.8rem;
      line-height: 1.6;
      min-height: 38px;
      position: relative;
      z-index: 2;
    }
    .enc-lock-icon {
      position: absolute;
      top: 14px; right: 14px;
      font-size: 1.2rem;
      z-index: 3;
    }
    .enc-id {
      margin-top: 14px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 2px;
      position: relative;
      z-index: 2;
    }
    .rarity-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 14px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .5px;
      position: relative;
      z-index: 2;
    }
    .rarity-badge.common { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.4); }
    .rarity-badge.rare   { background: rgba(99,102,241,0.18); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.5); }
    .rarity-badge.epic   { background: rgba(255,215,0,0.18); color: #FFD700; border: 1px solid rgba(255,215,0,0.5); }

    .progress-wrap {
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      padding: 22px 28px;
      margin-bottom: 26px;
      backdrop-filter: blur(14px);
    }
    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.85);
    }
    .progress-top b { color: #FFD700; font-size: 1.3rem; }
    .progress-bar {
      height: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #4ade80, #22c55e);
      background-size: 200% 100%;
      animation: progress-shine 4s linear infinite;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(74,222,128,0.4);
    }
    @keyframes progress-shine {
      0%   { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
  </style>
</head>
<body class="sg-body">
  <div class="sg-aurora"></div>
  <div class="sg-stars" id="sgStars"></div>

  <div class="sg-app">
    <aside class="sg-sidebar">
      <div class="sg-sidebar-brand"><h4>🌿 星芽花园</h4><div class="sub">STARGARDEN</div></div>
      <ul class="sg-menu">
        <li><a href="/tasks"><span class="icon">🏠</span>任务大厅</a></li>
        <li><a href="/garden"><span class="icon">🌱</span>我的花园</a></li>
        <li><a href="/encyclopedia"><span class="icon">📚</span>植物图鉴</a></li>
        <li><a href="/history"><span class="icon">📅</span>专注历史</a></li>
        <li><a href="/achievements"><span class="icon">🏆</span>成就中心</a></li>
        <li><a href="/friends"><span class="icon">👥</span>好友花园</a></li>
        <li><a href="/profile"><span class="icon">👤</span>个人中心</a></li>
        <li><a class="sg-menu-logout" href="/logout"><span class="icon">🚪</span>退出登录</a></li>
      </ul>
    </aside>

    <main class="sg-main">
      <h1 class="sg-page-title">📚 植物图鉴</h1>
      <p class="sg-page-subtitle">点亮全部稀有植物，成为最棒的星芽园丁 ✨</p>

      <!-- 收集进度 -->
      <div class="progress-wrap">
        <div class="progress-top">
          <span>📊 收集进度</span>
          <span>已解锁 <b th:text="${unlockedIds.size()}">0</b> / <span th:text="${allPlants.size()}">6</span> 种植物</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill"
               th:style="'width:' + ${progressPercent} + '%'"></div>
        </div>
      </div>

      <!-- 稀有度筛选 -->
      <div class="enc-filters">
        <span class="enc-filter active" data-r="all">🌟 全部</span>
        <span class="enc-filter" data-r="普通">★ 普通</span>
        <span class="enc-filter" data-r="稀有">★★ 稀有</span>
        <span class="enc-filter" data-r="史诗">★★★ 史诗</span>
      </div>

      <div class="enc-grid" id="encGrid">
        <div th:each="plant : ${allPlants}"
             class="enc-card"
             th:attr="data-rarity=${plant.rarity}"
             th:classappend="${!unlockedIds.contains(plant.id)} ? 'locked'">
          <span class="enc-lock-icon" th:if="${!unlockedIds.contains(plant.id)}">🔒</span>
          <span class="enc-emoji" th:text="${plant.icon} ?: '🌱'">🌱</span>
          <div class="enc-name" th:text="${plant.name}">智慧藤</div>
          <div class="enc-desc" th:text="${plant.description}">通过学习获得</div>
          <div>
            <span class="rarity-badge common" th:if="${plant.rarity == '普通'}">★ 普通</span>
            <span class="rarity-badge rare"   th:if="${plant.rarity == '稀有'}">★★ 稀有</span>
            <span class="rarity-badge epic"   th:if="${plant.rarity == '史诗'}">★★★ 史诗</span>
          </div>
          <div class="enc-id">NO.<span th:text="${#numbers.formatInteger(plant.id, 3)}">001</span></div>
        </div>
      </div>

      <div class="sg-footer">© 202339170206 魏佳冕 · 星芽花园 |  🌱 专注让生活开花</div>
    </main>
  </div>

  <script th:src="@{/js/stargarden.js}"></script>
  <script>
    createStarBackground('sgStars', { count: 180, shooting: true });

    // 稀有度排序：史诗 > 稀有 > 普通 > 其它，让稀有的更醒目
    var rank = { '史诗': 0, '稀有': 1, '普通': 2 };
    var grid = document.getElementById('encGrid');
    var cards = Array.prototype.slice.call(grid.querySelectorAll('.enc-card'));
    cards.sort(function (a, b) {
      var ra = rank[a.getAttribute('data-rarity')] != null ? rank[a.getAttribute('data-rarity')] : 9;
      var rb = rank[b.getAttribute('data-rarity')] != null ? rank[b.getAttribute('data-rarity')] : 9;
      return ra - rb;
    });
    cards.forEach(function (c) { grid.appendChild(c); });

    // 稀有度筛选
    document.querySelectorAll('.enc-filter').forEach(function (f) {
      f.addEventListener('click', function () {
        document.querySelectorAll('.enc-filter').forEach(function (x) { x.classList.remove('active'); });
        f.classList.add('active');
        var r = f.getAttribute('data-r');
        document.querySelectorAll('.enc-card').forEach(function (c) {
          c.style.display = (r === 'all' || c.getAttribute('data-rarity') === r) ? '' : 'none';
        });
      });
    });
  </script>
</body>
</html>
