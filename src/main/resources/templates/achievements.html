<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成就中心 · 星芽花园</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/stargarden.css}">
  <style>
    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
    }
    .ach-card {
      border-radius: 28px;
      padding: 30px 24px;
      text-align: center;
      background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(18px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }
    .ach-card::before {
      content: '';
      position: absolute;
      inset: -60%;
      background: conic-gradient(from 45deg, transparent 0 60%, rgba(255,215,0,0.12) 80%, transparent 100%);
      animation: spin 8s linear infinite;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .ach-card:hover::before { opacity: 1; }
    .ach-card:hover {
      transform: translateY(-8px) scale(1.03);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .ach-card > * { position: relative; z-index: 2; }
    .ach-card.locked {
      opacity: 0.6;
      filter: grayscale(0.6);
    }
    .ach-icon {
      width: 90px; height: 90px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px;
      margin: 0 auto 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .ach-card.achieved .ach-icon {
      background: linear-gradient(135deg, #FFD700, #f59e0b 60%, #4ade80);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .ach-card.locked .ach-icon {
      background: linear-gradient(135deg, #475569, #1e293b);
      border: 2px dashed rgba(255,255,255,0.2);
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.45), 0 10px 30px rgba(0,0,0,0.4); }
      50%     { box-shadow: 0 0 0 12px rgba(255,215,0,0), 0 10px 30px rgba(0,0,0,0.4); }
    }
    .ach-card h5 { color: #ffffff; font-weight: 700; margin-bottom: 8px; }
    .ach-card p { color: rgba(255,255,255,0.55); font-size: 0.85rem; line-height: 1.7; margin: 0 0 14px; min-height: 40px; }
    .ach-status {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .ach-card.achieved .ach-status {
      background: linear-gradient(135deg, rgba(74,222,128,0.3), rgba(255,215,0,0.2));
      color: #FFD700;
      border: 1px solid rgba(255,215,0,0.4);
    }
    .ach-card.locked .ach-status {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .ach-date {
      margin-top: 12px;
      font-size: 0.75rem;
      color: rgba(255,215,0,0.7);
      letter-spacing: 1px;
    }
    .ach-progress-mini {
      height: 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      margin-top: 10px;
    }
    .ach-progress-mini > div {
      height: 100%;
      background: linear-gradient(90deg, #FFD700, #4ade80);
      border-radius: 8px;
    }
    .ach-user-stat {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }
    .ach-user-stat .s {
      text-align: center;
      padding: 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(14px);
    }
    .ach-user-stat .s b {
      display: block;
      font-size: 2rem;
      color: #FFD700;
      font-weight: 800;
    }
    .ach-user-stat .s small {
      color: rgba(255,255,255,0.55);
      letter-spacing: 1px;
      font-size: 0.78rem;
    }
  </style>
</head>
<body class="sg-body">
  <div class="sg-aurora"></div>
  <div class="sg-stars" id="sgStars"></div>

  <div class="sg-app">
    <aside class="sg-sidebar">
      <div class="sg-sidebar-brand"><h4>🌿 星芽花园</h4><div class="sub">STARGARDEN</div></div>
      <ul class="sg-menu">
        <li><a href="/tasks"><span class="icon">🏠</span>任务大厅</a></li>
        <li><a href="/garden"><span class="icon">🌱</span>我的花园</a></li>
        <li><a href="/encyclopedia"><span class="icon">📚</span>植物图鉴</a></li>
        <li><a href="/history"><span class="icon">📅</span>专注历史</a></li>
        <li><a href="/achievements"><span class="icon">🏆</span>成就中心</a></li>
        <li><a href="/friends"><span class="icon">👥</span>好友花园</a></li>
        <li><a href="/profile"><span class="icon">👤</span>个人中心</a></li>
        <li><a class="sg-menu-logout" href="/logout"><span class="icon">🚪</span>退出登录</a></li>
      </ul>
    </aside>

    <main class="sg-main">
      <h1 class="sg-page-title">🏆 成就中心</h1>
      <p class="sg-page-subtitle">为你的每一次坚持喝彩！解锁的成就会持续闪耀 ✨</p>

      <!-- 用户概览 -->
      <div class="ach-user-stat">
        <div class="s">
          <b th:text="${achievedTypes != null} ? ${achievedTypes.size()} : 0">0</b>
          <small>🌟 已解锁成就</small>
        </div>
        <div class="s">
          <b th:text="${user.totalPlants}">0</b>
          <small>🌱 累计收集植物</small>
        </div>
        <div class="s">
          <b th:text="${user.consecutiveDays}">0</b>
          <small>🔥 连续打卡天数</small>
        </div>
      </div>

      <!-- 成就定义数组（前端渲染；同时使用 achievedTypes set 判断达成状态） -->
      <div class="ach-grid">
        <div id="achBox"></div>
      </div>

      <div class="sg-footer">© 202339170206 魏佳冕 · 星芽花园 |  🌱 专注让生活开花</div>
    </main>
  </div>

  <script th:src="@{/js/stargarden.js}"></script>
  <script th:inline="javascript">
    createStarBackground('sgStars', { count: 180, shooting: true });

    // 成就定义（与 GardenService 中 checkAchievements 保持一致）
    const achievedTypes = /*[[${achievedTypes != null ? new java.util.ArrayList(achievedTypes) : new java.util.ArrayList()}]]*/ [];
    const achievements = /*[[${achievements}]]*/ [];
    const defs = [
      { id: 'FIRST_PLANT',  name: '初次种植',     icon: '🌱', desc: '完成首次专注任务，成功获得第一颗植物种子',
        progress: { cur: Math.min(1, achievedTypes.includes('FIRST_PLANT') ? 1 : 0), total: 1, text: '首次完成专注任务' } },
      { id: 'SEVEN_DAYS',   name: '七天奇迹',     icon: '🔥', desc: '坚持连续 7 天完成专注任务打卡',
        progress: { cur: /*[[${user.consecutiveDays != null ? user.consecutiveDays : 0}]]*/ 0, total: 7, text: '连续打卡 7 天' } },
      { id: 'THIRTY_PLANTS',name: '满园芳菲',     icon: '🌸', desc: '累计收集 30 颗植物种子',
        progress: { cur: /*[[${user.totalPlants != null ? user.totalPlants : 0}]]*/ 0, total: 30, text: '收集 30 颗植物种子' } },
      { id: 'HUNDRED_MIN',  name: '专注力入门',   icon: '⏱', desc: '累计专注时长达到 100 分钟（累计型纪念成就）',
        progress: { cur: 0, total: 100, text: '累计专注 100 分钟' } },
      { id: 'FRIEND_01',    name: '花园初见',     icon: '👥', desc: '首次访问好友的花园并点赞鼓励',
        progress: { cur: 0, total: 1, text: '首次给好友花园点赞' } }
    ];
    // 额外：把已完成时间挂上去
    const doneMap = {};
    achievements.forEach(function(a){
      doneMap[a.achievementType] = new Date(a.achievedTime).toLocaleDateString();
    });
    function fmtDate(s){ if (!s) return ''; return '📅 达成于 ' + s; }
    function render(){
      const html = [];
      defs.forEach(function(d){
        const ok = achievedTypes.includes(d.id);
        const cur = Math.min(d.progress.cur, d.progress.total);
        const pct = (d.progress.total ? (cur / d.progress.total * 100) : 0).toFixed(0);
        const cls = ok ? 'achieved' : 'locked';
        html.push('<div class="ach-card ' + cls + '">');
        html.push('  <div class="ach-icon">' + d.icon + '</div>');
        html.push('  <h5>' + d.name + '</h5>');
        html.push('  <p>' + d.desc + '</p>');
        html.push('  <div class="ach-progress-mini"><div style="width:' + pct + '%;"></div></div>');
        html.push('  <div style="margin-top:6px;color:rgba(255,255,255,0.55);font-size:0.75rem;">' + d.progress.text + '：' + cur + ' / ' + d.progress.total + '</div>');
        html.push('  <div style="margin-top:10px;">');
        html.push('    <span class="ach-status">' + (ok ? '✅ 已达成' : '🔒 未解锁') + '</span>');
        html.push('  </div>');
        html.push('  <div class="ach-date">' + (ok ? fmtDate(doneMap[d.id]) : '继续专注，解锁这个成就吧～') + '</div>');
        html.push('</div>');
      });
      document.getElementById('achBox').parentElement.innerHTML = html.join('');
    }
    render();
  </script>
</body>
</html>
