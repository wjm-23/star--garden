<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注历史 · 星芽花园</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/stargarden.css}">
  <style>
    .day-group { margin-bottom: 28px; }
    .day-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .day-badge {
      width: 52px; height: 52px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(74,222,128,0.2), rgba(255,215,0,0.15));
      border: 1px solid rgba(255,215,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .day-badge b { color: #FFD700; font-size: 1.2rem; line-height: 1; }
    .day-badge small { color: rgba(255,255,255,0.6); font-size: 0.7rem; margin-top: 2px; letter-spacing: 1px; }
    .day-meta { flex: 1; }
    .day-meta h6 { color: #ffffff; margin: 0; font-weight: 700; }
    .day-meta small { color: rgba(255,255,255,0.5); font-size: 0.8rem; }

    .task-row {
      display: grid;
      grid-template-columns: 72px 1fr auto auto auto;
      gap: 16px;
      align-items: center;
      padding: 16px 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 10px;
      transition: all 0.3s;
    }
    .task-row:hover {
      border-color: rgba(74,222,128,0.3);
      transform: translateX(4px);
    }
    .task-emoji {
      width: 56px; height: 56px;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      background: linear-gradient(135deg, rgba(74,222,128,0.2), rgba(255,215,0,0.1));
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    .task-name  { color: #ffffff; font-weight: 600; }
    .task-sub   { color: rgba(255,255,255,0.5); font-size: 0.78rem; margin-top: 3px; }
    .task-plant { color: #FFD700; font-weight: 600; font-size: 0.9rem; }
    .task-time  { color: rgba(255,255,255,0.45); font-size: 0.78rem; letter-spacing: 1px; }
    .task-dur {
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, rgba(96,165,250,0.18), rgba(59,130,246,0.12));
      color: #60a5fa;
      border: 1px solid rgba(96,165,250,0.3);
      white-space: nowrap;
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px dashed rgba(255,255,255,0.1);
    }
    .empty-state .big { font-size: 5rem; display: block; margin-bottom: 16px; }
    .empty-state h4 { color: #FFD700; margin-bottom: 8px; font-weight: 700; }
    .empty-state p  { color: rgba(255,255,255,0.55); margin: 0; }

    @media (max-width: 768px) {
      .task-row { grid-template-columns: 60px 1fr; }
      .task-plant, .task-time, .task-dur { grid-column: 2 / -1; }
    }
  </style>
</head>
<body class="sg-body">
  <div class="sg-aurora"></div>
  <div class="sg-stars" id="sgStars"></div>

  <div class="sg-app">
    <aside class="sg-sidebar">
      <div class="sg-sidebar-brand"><h4>🌿 星芽花园</h4><div class="sub">STARGARDEN</div></div>
      <ul class="sg-menu">
        <li><a href="/tasks"><span class="icon">🏠</span>任务大厅</a></li>
        <li><a href="/garden"><span class="icon">🌱</span>我的花园</a></li>
        <li><a href="/encyclopedia"><span class="icon">📚</span>植物图鉴</a></li>
        <li><a href="/history"><span class="icon">📅</span>专注历史</a></li>
        <li><a href="/achievements"><span class="icon">🏆</span>成就中心</a></li>
        <li><a href="/friends"><span class="icon">👥</span>好友花园</a></li>
        <li><a href="/profile"><span class="icon">👤</span>个人中心</a></li>
        <li><a class="sg-menu-logout" href="/logout"><span class="icon">🚪</span>退出登录</a></li>
      </ul>
    </aside>

    <main class="sg-main">
      <h1 class="sg-page-title">📅 专注历史</h1>
      <p class="sg-page-subtitle">近 30 天的足迹，每一滴专注都有被认真记录 🌿</p>

      <div th:if="${records == null or #lists.isEmpty(records)}">
        <div class="empty-state">
          <span class="big">🌱</span>
          <h4>还没有专注记录</h4>
          <p>先去任务大厅完成第一次专注任务吧，<br>这里就会出现你种下的每一颗植物啦～</p>
          <a href="/tasks" class="sg-btn sg-btn-primary mt-4">🏠 去任务大厅开始专注</a>
        </div>
      </div>

      <div th:if="${records != null and !#lists.isEmpty(records)}">
        <div class="sg-card">
          <div th:each="recordsByDay : ${records}">
            <!-- This section will group records by date in the JS -->
          </div>
          <div id="historyContainer"></div>
        </div>
      </div>

      <div class="sg-footer">© 202339170206 魏佳冕 · 星芽花园 |  🌱 专注让生活开花</div>
    </main>
  </div>

  <script th:src="@{/js/stargarden.js}"></script>
  <script th:inline="javascript">
    createStarBackground('sgStars', { count: 180, shooting: true });

    // 将 Thymeleaf 数据安全转为 JS 对象并按日期分组
    const rawRecords = JSON.parse(/*[[${recordsJson}]]*/ '[]');
    const plantNameMap = JSON.parse(/*[[${plantMapJson}]]*/ '{}');

    function fmtDate(dt) {
      const d = new Date(dt);
      const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
      return {
        day: d.getDate().toString().padStart(2,'0'),
        month: (d.getMonth()+1) + '月',
        weekday: wd,
        full: d.toLocaleDateString(),
        hour: d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0')
      };
    }
    function renderHistory() {
      const groupMap = {};
      rawRecords.forEach(function(r){
        const d = fmtDate(r.completedTime);
        if (!groupMap[d.full]) groupMap[d.full] = { meta: d, list: [] };
        groupMap[d.full].list.push(r);
      });
      const html = [];
      Object.keys(groupMap).sort().reverse().forEach(function(k){
        const g = groupMap[k];
        const totalMin = g.list.reduce(function(s,x){ return s + (x.durationMinutes||0); }, 0);
        html.push('<div class="day-group">');
        html.push('  <div class="day-header">');
        html.push('    <div class="day-badge"><b>' + g.meta.day + '</b><small>' + g.meta.weekday + '</small></div>');
        html.push('    <div class="day-meta">');
        html.push('      <h6>' + g.meta.month + g.meta.day + '日 · ' + g.meta.weekday + '</h6>');
        html.push('      <small>' + g.list.length + ' 次专注 · 累计 ' + totalMin + ' 分钟</small>');
        html.push('    </div>');
        html.push('  </div>');
        g.list.forEach(function(r){
          const t = fmtDate(r.completedTime);
          const plantName = (plantNameMap && plantNameMap[r.plantId]) ? plantNameMap[r.plantId] : ('植物ID=' + r.plantId);
          const emoji = getPlantEmoji(plantName);
          const statusBadge = r.planted
            ? '<span class="sg-tag sg-tag-success" style="margin-left:6px;">已种植</span>'
            : '<span class="sg-tag sg-tag-warn"    style="margin-left:6px;">待种植</span>';
          html.push('<div class="task-row">');
          html.push('  <div class="task-emoji">' + emoji + '</div>');
          html.push('  <div>');
          html.push('    <div class="task-name">' + (r.taskName || '未命名任务') + '</div>');
          html.push('    <div class="task-sub">ID#' + r.id + statusBadge + '</div>');
          html.push('  </div>');
          html.push('  <div class="task-plant">' + plantName + '</div>');
          html.push('  <div class="task-time">' + t.hour + '</div>');
          html.push('  <div class="task-dur">⏱ ' + (r.durationMinutes||0) + ' 分钟</div>');
          html.push('</div>');
        });
        html.push('</div>');
      });
      document.getElementById('historyContainer').innerHTML = html.join('');
    }
    if (rawRecords.length) renderHistory();
  </script>
</body>
</html>
