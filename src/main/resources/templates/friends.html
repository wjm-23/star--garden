<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好友森林 · 星芽花园</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/stargarden.css}">
  <style>
    .empty-hint {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.5);
    }
    .empty-hint .icon {
      font-size: 4rem;
      margin-bottom: 18px;
      opacity: 0.6;
      display: block;
      animation: empty-float 4s ease-in-out infinite;
    }
    @keyframes empty-float {
      0%,100% { transform: translateY(0) rotate(-4deg); }
      50%     { transform: translateY(-12px) rotate(4deg); }
    }
    .empty-hint h5 {
      color: rgba(255,255,255,0.75);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .empty-hint p { margin: 0; font-size: 0.9rem; }

    /* 好友迷你花园预览悬浮 */
    .mini-garden-wrap {
      perspective: 900px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body class="sg-body">
  <div class="sg-aurora"></div>
  <div class="sg-stars" id="sgStars"></div>

  <div class="sg-app">
    <aside class="sg-sidebar">
      <div class="sg-sidebar-brand"><h4>🌿 星芽花园</h4><div class="sub">STARGARDEN</div></div>
      <ul class="sg-menu">
        <li><a href="/tasks"><span class="icon">🏠</span>任务大厅</a></li>
        <li><a href="/garden"><span class="icon">🌱</span>我的花园</a></li>
        <li><a href="/encyclopedia"><span class="icon">📚</span>植物图鉴</a></li>
        <li><a href="/history"><span class="icon">📅</span>专注历史</a></li>
        <li><a href="/achievements"><span class="icon">🏆</span>成就中心</a></li>
        <li><a href="/friends"><span class="icon">👥</span>好友花园</a></li>
        <li><a href="/profile"><span class="icon">👤</span>个人中心</a></li>
        <li><a class="sg-menu-logout" href="/logout"><span class="icon">🚪</span>退出登录</a></li>
      </ul>
    </aside>

    <main class="sg-main">
      <h1 class="sg-page-title">👥 好友森林</h1>
      <p class="sg-page-subtitle">搜索好友的花园，互相点赞鼓励，一起在专注之路上成长 🌱</p>

      <!-- 搜索栏 -->
      <div class="sg-card" style="padding: 22px 26px;">
        <div class="sg-search-wrap" style="margin:0;">
          <input type="text" id="searchUsername" class="sg-input" placeholder="🔍 输入好友的用户名，探索 TA 的花园...">
          <button class="sg-btn sg-btn-primary" onclick="searchFriend()">搜索</button>
        </div>
      </div>

      <!-- 搜索结果 -->
      <div id="friendResult" style="margin-top: 28px;">
        <div class="sg-card">
          <div class="empty-hint">
            <span class="icon">🌲</span>
            <h5>等待探索的好友森林</h5>
            <p>在上方输入框输入用户名，就能拜访 TA 的专属花园啦～</p>
          </div>
        </div>
      </div>

      <div class="sg-footer">© 202339170206 魏佳冕 · 星芽花园 |  🌱 专注让生活开花</div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script th:src="@{/js/stargarden.js}"></script>
  <script>
    createStarBackground('sgStars', { count: 180, shooting: true });

    // 回车搜索
    document.getElementById('searchUsername').addEventListener('keypress', function(e){
      if (e.key === 'Enter') searchFriend();
    });

    function renderMiniGarden(gardenData) {
      let html = '<div class="mini-garden-wrap"><div class="sg-garden sg-garden-3">';
      gardenData = gardenData || {};
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          const key = i + ',' + j;
          const plant = gardenData[key];
          if (plant && plant.name) {
            html += '<div class="sg-garden-cell occupied"><span class="plant-emoji">' + getPlantEmoji(plant.name) + '</span></div>';
          } else {
            html += '<div class="sg-garden-cell empty" style="cursor:default;"><span class="seed-icon">🌱</span></div>';
          }
        }
      }
      html += '</div></div>';
      return html;
    }

    function showFriendToast(msg, type) {
      type = type || 'info';
      const colors = {
        success: 'linear-gradient(135deg, rgba(74,222,128,0.95), rgba(34,197,94,0.95))',
        danger:  'linear-gradient(135deg, rgba(248,113,113,0.95), rgba(239,68,68,0.95))',
        info:    'linear-gradient(135deg, rgba(96,165,250,0.95), rgba(59,130,246,0.95))',
        warn:    'linear-gradient(135deg, rgba(250,204,21,0.95), rgba(234,179,8,0.95))'
      };
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;top:36px;left:50%;transform:translateX(-50%) translateY(-20px);' +
        'background:' + colors[type] + ';color:#fff;padding:14px 28px;border-radius:50px;' +
        'font-weight:600;z-index:9999;box-shadow:0 12px 32px rgba(0,0,0,0.35);' +
        'opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);font-size:.92rem;';
      document.body.appendChild(t);
      requestAnimationFrame(function(){
        t.style.opacity = '1';
        t.style.transform = 'translateX(-50%) translateY(0)';
      });
      setTimeout(function(){
        t.style.opacity = '0';
        t.style.transform = 'translateX(-50%) translateY(-20px)';
        setTimeout(function(){ t.remove(); }, 500);
      }, 2600);
    }

    // 取用户名首字做头像 emoji
    function avatarFromName(name) {
      const map = ['🌻','🌿','🌸','🍀','🌵','🌴','🌳','🌲','🌺','🌼','🍃','🌱'];
      if (!name) return '🌻';
      let sum = 0;
      for (let i = 0; i < name.length; i++) sum += name.charCodeAt(i);
      return map[sum % map.length];
    }

    function searchFriend() {
      const username = document.getElementById('searchUsername').value.trim();
      const box = document.getElementById('friendResult');

      if (!username) {
        showFriendToast('请输入要搜索的用户名哦～', 'warn');
        return;
      }

      // 加载态
      box.innerHTML = '<div class="sg-card"><div class="empty-hint"><span class="icon">🔍</span><h5>正在寻找花园...</h5><p>请稍候，星芽正在连接好友的花园 ✨</p></div></div>';

      $.get('/friends/search', { username: username }, function(res) {
        if (!res.success) {
          box.innerHTML =
            '<div class="sg-card"><div class="empty-hint">' +
              '<span class="icon">🌫️</span>' +
              '<h5>找不到这座花园</h5>' +
              '<p>' + (res.msg || '用户名不存在，换一个试试吧～') + '</p>' +
            '</div></div>';
          return;
        }

        const nick = res.nickname || res.username;
        const likeBtn = res.hasLikedToday
          ? '<button class="sg-like-btn active" disabled>❤️ 今日已赞</button>'
          : '<button class="sg-like-btn" onclick="likeFriend(' + res.id + ')">❤️ 点赞鼓励</button>';

        box.innerHTML =
          '<div class="sg-friend-card">' +
            '<div class="sg-friend-head">' +
              '<div class="sg-friend-avatar">' + avatarFromName(nick) + '</div>' +
              '<div class="sg-friend-info">' +
                '<h4>✨ ' + nick + ' 的花园</h4>' +
                '<p>@' + res.username + ' · 星芽花园的专注园丁</p>' +
              '</div>' +
            '</div>' +

            '<div class="sg-friend-stats">' +
              '<div class="sg-friend-stat"><div class="num">' + (res.totalPlants || 0) + '</div><div class="lbl">🌱 已种植物</div></div>' +
              '<div class="sg-friend-stat"><div class="num">' + (res.consecutiveDays || 0) + '</div><div class="lbl">🔥 连续打卡</div></div>' +
              '<div class="sg-friend-stat"><div class="num">' + (res.likeCount || 0) + '</div><div class="lbl">❤️ 获赞数</div></div>' +
            '</div>' +

            renderMiniGarden(res.gardenMap || {}) +

            '<div class="sg-friend-actions" style="margin-top:22px;">' + likeBtn + '</div>' +
          '</div>';
      }).fail(function() {
        box.innerHTML =
          '<div class="sg-card"><div class="empty-hint">' +
            '<span class="icon">⚠️</span>' +
            '<h5>网络连接出了点问题</h5>' +
            '<p>请检查网络后重试～</p>' +
          '</div></div>';
      });
    }

    function likeFriend(friendId) {
      $.post('/friends/like', { friendId: friendId }, function(res) {
        if (res.success) {
          showFriendToast('❤️ 点赞成功！当前点赞数：' + res.newCount, 'success');
          searchFriend(); // 刷新
        } else {
          showFriendToast(res.msg || '点赞失败', 'danger');
        }
      }).fail(function() {
        showFriendToast('网络错误，请稍后重试', 'danger');
      });
    }
  </script>
</body>
</html>
