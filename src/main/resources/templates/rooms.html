<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>协作专注房间 - 星芽花园</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a2a3a 0%, #0d1b2a 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', 'Poppins', 'Microsoft YaHei', sans-serif;
        }
        .container { padding-top: 30px; padding-bottom: 40px; }
        .home-btn {
            position: fixed; bottom: 25px; right: 25px;
            background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
            border-radius: 50px; padding: 12px 24px; color: white;
            text-decoration: none; transition: all 0.3s; z-index: 100;
        }
        .home-btn:hover { background: rgba(255,215,0,0.8); color: #1a2a3a; }
        .page-card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px);
            border-radius: 30px; padding: 28px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }
        .page-title { color: #FFD700; margin-bottom: 8px; }
        .sub-title { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 18px; }
        .room-input {
            background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.25);
            color: white; border-radius: 50px; padding: 10px 20px; width: 100%;
        }
        .room-input:focus { outline: none; border-color: rgba(255,215,0,0.6); }
        .btn-gold {
            background: linear-gradient(135deg, #FFD700, #FFA500); color: #1a2a3a;
            border: none; border-radius: 50px; padding: 10px 28px; font-weight: 600;
        }
        .btn-ghost {
            background: transparent; border: 1px solid rgba(255,255,255,0.4);
            color: white; border-radius: 50px; padding: 10px 24px;
        }
        .member-item {
            background: rgba(0,0,0,0.3); border-radius: 50px;
            padding: 8px 18px; color: white; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot-focus { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .dot-idle { background: #95a5a6; }
        #chatBox {
            background: rgba(0,0,0,0.35); border-radius: 20px; padding: 15px;
            height: 300px; overflow-y: auto; margin-bottom: 12px;
        }
        .chat-msg { color: rgba(255,255,255,0.9); margin-bottom: 8px; font-size: 0.92rem; word-break: break-all; }
        .chat-msg .who { color: #FFD700; font-weight: 600; }
        .chat-msg.system { color: rgba(255,255,255,0.45); font-style: italic; font-size: 0.85rem; }
        .pk-row { display: flex; align-items: center; margin-bottom: 10px; color: white; }
        .pk-rank { width: 34px; font-size: 1.2rem; text-align: center; }
        .pk-bar-wrap { flex: 1; background: rgba(0,0,0,0.35); border-radius: 50px; height: 26px; margin: 0 12px; overflow: hidden; }
        .pk-bar { height: 100%; background: linear-gradient(90deg, #FFD700, #FFA500); border-radius: 50px; transition: width 0.6s; }
        .pk-min { width: 80px; text-align: right; color: #FFD700; font-weight: 600; }
        footer { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.8rem; }
        .live-badge { color: #2ecc71; font-size: 0.85rem; }
        .live-badge::before { content: '● '; animation: blink 1.2s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>
<div class="container">
    <!-- 未加入房间：大厅 -->
    <div id="lobby" class="page-card">
        <h2 class="page-title">🏠 协作专注房间</h2>
        <p class="sub-title">和朋友进入同一房间，互相看见彼此的专注状态，还能实时 PK 今日专注时长（WebSocket 实时通信）</p>
        <div class="row g-3 align-items-center">
            <div class="col-md-6">
                <label style="color:rgba(255,255,255,0.75); margin-bottom:6px;">创建或加入房间（输入房间号）</label>
                <input id="roomIdInput" class="room-input" placeholder="例如：room-20233917" maxlength="30">
            </div>
            <div class="col-md-6 d-flex gap-2 mt-4">
                <button class="btn btn-gold" onclick="joinRoom()">进入房间</button>
                <button class="btn btn-ghost" onclick="randomRoom()">随机房间</button>
            </div>
        </div>
        <div style="margin-top:22px;">
            <h6 style="color:rgba(255,255,255,0.75);">当前活跃房间</h6>
            <div id="activeRooms" style="color:rgba(255,255,255,0.6); font-size:0.9rem;">加载中...</div>
        </div>
    </div>

    <!-- 已加入房间：房间内 -->
    <div id="inRoom" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 style="color:#FFD700;">🚀 房间 <span id="roomTitle"></span></h3>
            <div>
                <span class="live-badge" id="wsStatus">已连接</span>
                <button class="btn btn-ghost ms-2" onclick="leaveRoom()">离开房间</button>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-5">
                <div class="page-card">
                    <h5 style="color:white;">房间成员</h5>
                    <div id="memberList"></div>
                    <hr style="border-color:rgba(255,255,255,0.15);">
                    <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-gold" id="focusBtn" onclick="toggleFocus()">开始专注 25 分钟</button>
                    </div>
                    <p style="color:rgba(255,255,255,0.55); font-size:0.85rem; margin:12px 0 0;">
                        专注结束后，完成的时长将计入今日花园任务记录</p>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="page-card">
                    <ul class="nav nav-pills mb-3" role="tablist">
                        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabChat"
                            style="border-radius:50px;">💬 房间聊天</button></li>
                        <li class="nav-item ms-2"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabPk"
                            style="border-radius:50px;" onclick="sendPk()">⚡ 好友 PK 榜</button></li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tabChat">
                            <div id="chatBox"></div>
                            <div class="d-flex gap-2">
                                <input id="chatInput" class="room-input" placeholder="给房间里的小伙伴加油..." maxlength="120"
                                       onkeydown="if(event.key==='Enter')sendChat()">
                                <button class="btn btn-gold" onclick="sendChat()">发送</button>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="tabPk">
                            <div id="pkBoard"></div>
                            <p style="color:rgba(255,255,255,0.55); font-size:0.85rem; margin-top:10px;">
                                榜单为房间内成员「今日」累计专注分钟数，专注结束自动刷新</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>©  202339170206 魏佳冕 - 星芽花园</footer>
</div>
<a href="/index" class="home-btn">🏠 返回花园</a>

<script th:inline="javascript">
    const myId = /*[[${session.user != null ? session.user.id : 0}]]*/ 0;
    const myName = /*[[${session.user != null ? ((session.user.nickname != null and !session.user.nickname.isEmpty()) ? session.user.nickname : session.user.username) : '访客'}]]*/ '访客';
</script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let ws = null;
    let currentRoom = null;
    let focusing = false;
    let focusTimer = null;
    let focusSecondsLeft = 0;

    // ===== 大厅 =====
    function loadActiveRooms() {
        $.get('/api/rooms', function(res) {
            const box = $('#activeRooms');
            if (!res.success || res.rooms.length === 0) {
                box.text('暂无活跃房间，来创建第一个吧！');
                return;
            }
            box.empty();
            res.rooms.forEach(r => {
                box.append('<span class="badge rounded-pill" style="background:rgba(255,215,0,0.2);color:#FFD700;padding:8px 16px;margin:4px;cursor:pointer;" onclick="$(\'#roomIdInput\').val(\'' + r.roomId + '\')">🚪 ' + r.roomId + '（' + r.memberCount + ' 人）</span>');
            });
        });
    }
    loadActiveRooms();
    setInterval(loadActiveRooms, 5000);

    function randomRoom() {
        $('#roomIdInput').val('room-' + Math.floor(Math.random() * 9000 + 1000));
        joinRoom();
    }

    function joinRoom() {
        const roomId = $('#roomIdInput').val().trim();
        if (!roomId) { alert('请输入房间号'); return; }
        currentRoom = roomId;
        $('#roomTitle').text(roomId);
        $('#lobby').hide();
        $('#inRoom').show();
        connectWs();
    }

    function leaveRoom() {
        if (ws) { ws.close(); ws = null; }
        stopFocus(false);
        $('#inRoom').hide();
        $('#lobby').show();
        $('#chatBox').empty();
        loadActiveRooms();
    }

    // ===== WebSocket =====
    function connectWs() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(proto + '://' + location.host + '/ws/room/' + encodeURIComponent(currentRoom)
            + '?uid=' + myId + '&uname=' + encodeURIComponent(myName));
        ws.onopen = () => $('#wsStatus').text('已连接');
        ws.onclose = () => $('#wsStatus').text('已断开');
        ws.onerror = () => $('#wsStatus').text('连接异常');
        ws.onmessage = e => handleMsg(JSON.parse(e.data));
    }

    function handleMsg(m) {
        switch (m.type) {
            case 'system':
                appendChat(null, m.msg, true);
                renderMembers(m.members);
                break;
            case 'focus-start':
                appendChat(null, '📣 ' + m.who + ' 开始了 ' + m.minutes + ' 分钟专注，一起加油！', true);
                renderMembers(m.members);
                break;
            case 'focus-end':
                appendChat(null, '🎉 ' + m.who + ' 完成了 ' + m.minutes + ' 分钟协作专注，时长已计入花园记录！', true);
                renderMembers(m.members);
                break;
            case 'chat':
                appendChat(m.who, m.msg, false);
                break;
            case 'pk':
                renderPk(m.board);
                break;
        }
    }

    function renderMembers(members) {
        const box = $('#memberList').empty();
        (members || []).forEach(mem => {
            box.append('<div class="member-item"><span><span class="status-dot ' + (mem.focusing ? 'dot-focus' : 'dot-idle') + '"></span>' + escapeHtml(mem.name) + '</span><span style="color:' + (mem.focusing ? '#2ecc71' : '#95a5a6') + ';font-size:0.85rem;">' + (mem.focusing ? '专注中' : '休息中') + '</span></div>');
        });
    }

    function renderPk(board) {
        const box = $('#pkBoard').empty();
        const max = Math.max(...board.map(b => b.minutes), 1);
        const medals = ['🥇', '🥈', '🥉'];
        board.forEach((b, i) => {
            box.append('<div class="pk-row"><span class="pk-rank">' + (medals[i] || (i + 1)) + '</span>'
                + '<span style="width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(b.name) + '</span>'
                + '<div class="pk-bar-wrap"><div class="pk-bar" style="width:' + Math.round(b.minutes / max * 100) + '%"></div></div>'
                + '<span class="pk-min">' + b.minutes + ' 分钟</span></div>');
        });
    }

    function appendChat(who, msg, isSystem) {
        const box = $('#chatBox');
        box.append(isSystem
            ? '<div class="chat-msg system">' + escapeHtml(msg) + '</div>'
            : '<div class="chat-msg"><span class="who">' + escapeHtml(who) + '：</span>' + escapeHtml(msg) + '</div>');
        box.scrollTop(box[0].scrollHeight);
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function sendChat() {
        const input = $('#chatInput');
        const msg = input.val().trim();
        if (!msg || !ws) return;
        ws.send(JSON.stringify({ type: 'chat', msg: msg }));
        input.val('');
    }

    function sendPk() {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'pk' }));
    }

    // ===== 专注计时 =====
    function toggleFocus() {
        if (!focusing) startFocus(25);
        else stopFocus(true);
    }

    function startFocus(minutes) {
        focusing = true;
        focusSecondsLeft = minutes * 60;
        $('#focusBtn').text('结束专注（' + minutes + ':00）').removeClass('btn-gold').addClass('btn-ghost');
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'focus-start', minutes: minutes }));
        focusTimer = setInterval(() => {
            focusSecondsLeft--;
            const mm = String(Math.floor(focusSecondsLeft / 60)).padStart(2, '0');
            const ss = String(focusSecondsLeft % 60).padStart(2, '0');
            $('#focusBtn').text('结束专注（' + mm + ':' + ss + '）');
            if (focusSecondsLeft <= 0) finishFocus();
        }, 1000);
    }

    function stopFocus(finish) {
        clearInterval(focusTimer);
        focusTimer = null;
        if (finish && focusing) finishFocus();
        else {
            focusing = false;
            $('#focusBtn').text('开始专注 25 分钟').addClass('btn-gold').removeClass('btn-ghost');
        }
    }

    function finishFocus() {
        clearInterval(focusTimer);
        focusTimer = null;
        focusing = false;
        $('#focusBtn').text('开始专注 25 分钟').addClass('btn-gold').removeClass('btn-ghost');
        if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'focus-end' }));
        }
        alert('🎉 本次协作专注完成！时长已计入你的花园记录');
    }
</script>
</body>
</html>
